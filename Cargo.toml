# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "openref"
version = "0.1.0"
edition = "2021"
description = "Reference-image boards: paste, drop, arrange and annotate images on an infinite canvas"
license = "GPL-3.0-or-later"
repository = "https://github.com/carlesllavata/OpenRef"
publish = false
build = "build.rs"

[lib]
name = "openref"
path = "src/lib.rs"

[[bin]]
name = "OpenRef"
path = "src/main.rs"

[dependencies]
arboard = "3.7"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "persistence",
    "wgpu",
] }
egui = { version = "0.37", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "webp"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Image decoding is far too slow without optimisation, so debug builds optimise the libraries.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
